x-agent: &agent
  build: .
  env_file: .env
  environment:
    # inside the compose network, services are reached by name, not localhost
    DATABASE_URL: postgresql://hive:hive@postgres:5432/hive
    NATS_URL: nats://nats:4222
    NEO4J_URI: bolt://neo4j:7687
    LITELLM_BASE_URL: http://litellm:4000
    MEMORY_MCP_URL: http://memory-mcp:8200/mcp
    FITNESS_URL: http://fitness:8101
    WELLBEING_URL: http://wellbeing:8102
    WORK_URL: http://work:8103
    CONCIERGE_URL: http://concierge:8100
    AUDIT_LOG: /app/audit/memory.jsonl
  volumes: ["./audit:/app/audit"]
  depends_on:
    postgres: { condition: service_healthy }
    neo4j: { condition: service_healthy }
    nats: { condition: service_started }
    litellm: { condition: service_started }

services:
  concierge:
    <<: *agent
    command: ["uvicorn", "daemonhive.agents.concierge.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["8100:8100"]

  fitness:
    <<: *agent
    command: ["uvicorn", "daemonhive.agents.fitness.app:app", "--host", "0.0.0.0", "--port", "8101"]
    ports: ["8101:8101"]

  wellbeing:
    <<: *agent
    command: ["uvicorn", "daemonhive.agents.wellbeing.app:app", "--host", "0.0.0.0", "--port", "8102"]
    ports: ["8102:8102"]

  work:
    <<: *agent
    command: ["uvicorn", "daemonhive.agents.work.app:app", "--host", "0.0.0.0", "--port", "8103"]
    ports: ["8103:8103"]

  memory-mcp:
    <<: *agent
    command: ["python", "-m", "daemonhive.mcp.memory_server", "--transport", "http", "--port", "8200"]

  # the Telegram bot: `docker compose --profile telegram up -d`
  gateway:
    <<: *agent
    profiles: ["telegram"]
    command: ["python", "-m", "daemonhive.gateway.telegram"]

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: hive, POSTGRES_PASSWORD: hive, POSTGRES_DB: hive }
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment: { NEO4J_AUTH: neo4j/hivehive }
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports: ["4222:4222"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    # LITELLM_CONFIG=litellm.local.yaml -> LM Studio on your machine ($0)
    command: ["--config", "/etc/litellm/${LITELLM_CONFIG:-litellm.local.yaml}", "--port", "4000"]
    volumes: ["./deploy:/etc/litellm:ro"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["4000:4000"]
