[project]
name = "daemonhive"
version = "0.3.0"
description = "A small hive of personal agents that talk to each other (A2A) and share a temporal memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "nats-py>=2.7",
  "fastmcp>=2.0",
  "graphiti-core>=0.5",
  "python-telegram-bot>=21.0",
  "pyyaml>=6.0",
  "langsmith>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daemonhive"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"
