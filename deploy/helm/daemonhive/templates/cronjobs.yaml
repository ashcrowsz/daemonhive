{{- range $name, $c := .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
spec:
  schedule: {{ $c.schedule | quote }}
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: job
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              command: {{ toJson $c.command }}
              envFrom: [{ secretRef: { name: hive-{{ $name }} } }]
{{- end }}
