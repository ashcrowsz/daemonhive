# Hosted setup: same tier aliases, hosted models behind them. Needs ANTHROPIC_API_KEY.
# Per-agent budgets need LiteLLM's key DB: set LITELLM_MASTER_KEY + LITELLM_DATABASE_URL, then
#   curl -X POST $LITELLM/key/generate -d '{"key_alias":"fitness","max_budget":5,"budget_duration":"30d"}'
model_list:
  - model_name: hive-small
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: hive-large
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
